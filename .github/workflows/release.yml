# Push a tag like v1.0.0.0: builds the plugin zip, attaches it to a GitHub release
# and adds that version to manifest.json on main (the Jellyfin repository URL).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test -c Release

      - name: Build zip
        id: build
        run: |
          pip install jprm==1.1.0
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          zip=$(jprm plugin build . -o artifacts -v "$version" --dotnet-framework net10.0)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update manifest
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "${{ steps.build.outputs.zip }}")"
          git fetch origin main && git checkout main
          jprm repo add -U "$url" . "${{ steps.build.outputs.zip }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add version ${{ steps.build.outputs.version }} to manifest"
          git push origin main
